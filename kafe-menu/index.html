<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kafe Menüsü</title>

    <style>
        body {
            margin: 0;
            background: #2b1b14;
            color: #fff8ed;
            font-family: Georgia, serif;
        }

        button {
            padding: 12px 18px;
            border: 1px solid #b78c52;
            border-radius: 24px;
            background: #41291e;
            color: #fff8ed;
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible {
            outline: 3px solid #ffd98a;
            outline-offset: 3px;
        }

        .giris {
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px;
            box-sizing: border-box;
            display: grid;
            place-items: center;
            text-align: center;
            background:
                linear-gradient(180deg, rgba(43, 27, 20, .32), rgba(43, 27, 20, .85)),
                url("kafe.jpg") center / cover no-repeat;
        }

        .giris h1 {
            margin: 0 0 24px;
            font-size: clamp(3rem, 9vw, 6rem);
            line-height: 1.05;
        }

        .ana-dugme,
        button[aria-pressed="true"] {
            background: #ffd98a;
            color: #2b1b14;
            font-weight: bold;
        }

        .kategori-paneli {
            position: fixed;
            inset: auto 0 0;
            width: min(100%, 540px);
            max-width: 100%;
            max-height: 85vh;
            margin: 0 auto;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            border: 1px solid #79563e;
            border-radius: 24px 24px 0 0;
            background: #2b1b14;
            color: #fff8ed;
        }

        .kategori-paneli[open] {
            animation: panel-acil 220ms ease-out;
        }

        .kategori-paneli::backdrop {
            background: rgba(0, 0, 0, .55);
        }

        @keyframes panel-acil {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .kategori-paneli[open] {
                animation: none;
            }
        }

        .panel-baslik {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel-baslik h2 {
            margin: 0;
        }

        .panel-secenekleri {
            display: grid;
            gap: 8px;
        }

        .panel-secenekleri button {
            text-align: left;
            border-radius: 12px;
        }

        .menu {
            max-width: 600px;
            margin: 0 auto;
            padding: 32px 20px 48px;
        }

        .filtreler {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .menu ul {
            list-style: none;
            padding: 0;
        }

        .menu li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 12px;
            background: #41291e;
        }

        .urun {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }

        .urun img {
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 8px;
        }

        .fiyat {
            color: #ffd98a;
            font-weight: bold;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <header class="giris">
        <div>
            <h1>Kafe Menüsü</h1>
            <button id="menu-ac" class="ana-dugme" type="button">
                Menüyü Gör
            </button>
        </div>
    </header>

    <dialog id="kategori-paneli" class="kategori-paneli" aria-labelledby="panel-baslik">
        <div class="panel-baslik">
            <h2 id="panel-baslik">Menü</h2>
            <form method="dialog">
                <button type="submit" aria-label="Kategori panelini kapat">✕</button>
            </form>
        </div>

        <div class="panel-secenekleri">
            <button type="button" data-kategori="tumu">Tüm Menü</button>
            <button type="button" data-kategori="sicak">Sıcak İçecekler</button>
            <button type="button" data-kategori="soguk">Soğuk İçecekler</button>
            <button type="button" data-kategori="tatli">Tatlılar</button>
        </div>
    </dialog>

    <main class="menu">
        <h2 id="menu-baslik" tabindex="-1">Menü</h2>

        <nav class="filtreler" aria-label="Menü kategorileri">
            <button type="button" data-kategori="tumu">Tümü</button>
            <button type="button" data-kategori="sicak">Sıcak İçecekler</button>
            <button type="button" data-kategori="soguk">Soğuk İçecekler</button>
            <button type="button" data-kategori="tatli">Tatlılar</button>
        </nav>

        <section data-bolum="sicak" aria-labelledby="sicak">
            <h3 id="sicak">Sıcak İçecekler</h3>
            <ul>
                <li>
                    <span class="urun"><img src="turk-kahvesi.png" alt="" width="56" height="56">Türk kahvesi</span>
                    <span class="fiyat">80 TL</span>
                </li>
                <li>
                    <span class="urun"><img src="latte.png" alt="" width="56" height="56">Latte</span>
                    <span class="fiyat">110 TL</span>
                </li>
                <li>
                    <span class="urun"><img src="cappuccino.png" alt="" width="56" height="56">Cappuccino</span>
                    <span class="fiyat">115 TL</span>
                </li>
            </ul>
        </section>

        <section data-bolum="soguk" aria-labelledby="soguk">
            <h3 id="soguk">Soğuk İçecekler</h3>
            <ul>
                <li>
                    <span class="urun"><img src="buzlu-latte.png" alt="" width="56" height="56">Buzlu latte</span>
                    <span class="fiyat">125 TL</span>
                </li>
                <li>
                    <span class="urun"><img src="limonata.png" alt="" width="56" height="56">Ev yapımı limonata</span>
                    <span class="fiyat">95 TL</span>
                </li>
                <li>
                    <span class="urun"><img src="soguk-cikolata.png" alt="" width="56" height="56">Soğuk çikolata</span>
                    <span class="fiyat">130 TL</span>
                </li>
            </ul>
        </section>

        <section data-bolum="tatli" aria-labelledby="tatli">
            <h3 id="tatli">Tatlılar</h3>
            <ul>
                <li>
                    <span class="urun"><img src="san-sebastian.png" alt="" width="56" height="56">San Sebastian cheesecake</span>
                    <span class="fiyat">180 TL</span>
                </li>
                <li>
                    <span class="urun"><img src="brownie.png" alt="" width="56" height="56">Brownie</span>
                    <span class="fiyat">140 TL</span>
                </li>
                <li>
                    <span class="urun"><img src="tiramisu.png" alt="" width="56" height="56">Tiramisu</span>
                    <span class="fiyat">160 TL</span>
                </li>
            </ul>
        </section>
    </main>

    <script>
        const panel = document.getElementById('kategori-paneli');
        const menuBaslik = document.getElementById('menu-baslik');
        const kategoriler = document.querySelectorAll('[data-bolum]');
        const filtreDugmeleri = document.querySelectorAll('.filtreler button');

        document.getElementById('menu-ac').addEventListener('click', () => {
            panel.showModal();
        });

        function filtrele(secim) {
            kategoriler.forEach((bolum) => {
                bolum.hidden = secim !== 'tumu' && bolum.dataset.bolum !== secim;
            });

            filtreDugmeleri.forEach((dugme) => {
                dugme.setAttribute('aria-pressed', dugme.dataset.kategori === secim);
            });
        }

        document.querySelectorAll('[data-kategori]').forEach((dugme) => {
            dugme.addEventListener('click', () => {
                filtrele(dugme.dataset.kategori);

                if (panel.contains(dugme)) {
                    panel.close();
                    menuBaslik.focus({ preventScroll: true });
                    menuBaslik.scrollIntoView({ block: 'start' });
                }
            });
        });

        filtrele('tumu');
    </script>
</body>
</html>
